
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">
            Patient Login
        </h1>

        <div class="space-y-5">

            <div>

                <label class="block text-sm font-semibold text-slate-600 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    class="w-full border border-slate-300 rounded-xl p-3"
                >

            </div>

            <div>

                <label class="block text-sm font-semibold text-slate-600 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    class="w-full border border-slate-300 rounded-xl p-3"
                >

            </div>

            <button
                onclick="loginPatient()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold"
            >
                Login
            </button>
            <button onclick="window.location.href='/patientsignup.html'" class="w-full mt-3 border border-blue-600 text-blue-600 hover:bg-blue-50 py-3 rounded-xl font-bold" > Create New Account </button>

        </div>

    </div>

<script>



async function loginPatient() {

    try {

        const email =
            document.getElementById('email').value;

        const password =
            document.getElementById('password').value;

        const response = await fetch('/api/patients');

        const patients = await response.json();

        const patient = patients.find(p =>
            p.email === email &&
            p.password === password
        );

        if (!patient) {

            alert('Invalid email or password');

            return;
        }

        localStorage.setItem(
            'patientId',
            patient.patient_id
        );

        alert('Login Successful');

        window.location.href = '/patient.html';

    } catch (error) {

        console.error(error);

    }
}

</script>




</body>
</html>
