
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Signup</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">
            Patient Signup
        </h1>

        <div class="space-y-5">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                class="w-full border border-slate-300 rounded-xl p-3"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                class="w-full border border-slate-300 rounded-xl p-3"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                class="w-full border border-slate-300 rounded-xl p-3"
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                class="w-full border border-slate-300 rounded-xl p-3"
            >

            <select
                id="gender"
                class="w-full border border-slate-300 rounded-xl p-3"
            >
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <button
                onclick="signupPatient()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold"
            >
                Create Account
            </button>

        </div>

    </div>
   
<script>

async function signupPatient() {

    try {

        const name =
            document.getElementById('name').value;

        const email =
            document.getElementById('email').value;

        const password =
            document.getElementById('password').value;

        const phone =
            document.getElementById('phone').value;

        const gender =
            document.getElementById('gender').value;

        const response = await fetch('/api/patients', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

           body: JSON.stringify({
    name,
    gender,
    date_of_birth: null,
    blood_group: null,
    phone,
    email,
    address: null,
    password
})

        });

        if (!response.ok) {

            alert('Signup Failed');

            return;
        }

        alert('Account Created Successfully');

        window.location.href = '/patientlogin.html';

    } catch (error) {

        console.error(error);

    }
}

</script>



</body>
</html>
