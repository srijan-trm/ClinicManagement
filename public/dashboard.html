<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth fade for table data */
        #table-body { transition: opacity 0.2s ease-in-out; }
        .loading { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal text-gray-800">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <div class="w-64 bg-white shadow-xl border-r border-gray-200 flex flex-col z-10">
            <div class="p-6 border-b border-gray-100 bg-blue-600">
                <h1 class="text-2xl font-bold text-white tracking-wide">MediClinic</h1>
            </div>
            <nav class="mt-4 flex-1 space-y-1 px-2" id="sidebar-nav">
                <!-- Navigation Buttons -->
                <button onclick="switchTab('patients')" id="tab-patients" class="w-full text-left flex items-center py-3 px-4 rounded-lg bg-blue-50 text-blue-700 font-semibold transition-all">
                    👥 Patients Directory
                </button>
                <button onclick="switchTab('doctors')" id="tab-doctors" class="w-full text-left flex items-center py-3 px-4 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all">
                    🩺 Doctors Directory
                </button>
                <button onclick="switchTab('appointments')" id="tab-appointments" class="w-full text-left flex items-center py-3 px-4 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all">
                    📅 Appointments
                </button>
                <button onclick="switchTab('medicines')" id="tab-medicines" class="w-full text-left flex items-center py-3 px-4 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all">
                    💊 Pharmacy Inventory
                </button>
            </nav>
            <div class="p-4 border-t border-gray-200 bg-gray-50 text-xs text-gray-500 text-center">
                System Version 1.0.0
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 flex flex-col">
            
            <!-- Top Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 px-8 py-5 flex justify-between items-center">
                <h2 id="page-title" class="text-2xl font-bold text-gray-800">Patients Directory</h2>
                <div class="flex items-center space-x-4">
                    <div class="text-sm px-4 py-2 rounded-full border shadow-sm font-medium flex items-center space-x-2 bg-white">
                        <span class="text-gray-500">API Link:</span> 
                        <span id="server-status" class="text-yellow-500 flex items-center">
                            <span class="animate-pulse mr-1">●</span> Checking...
                        </span>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <div class="p-8 flex-1">
                <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                    
                    <!-- Toolbar -->
                    <div class="px-6 py-4 border-b border-gray-200 bg-gray-50/50 flex justify-between items-center">
                        <div class="relative">
                            <input type="text" placeholder="Search records..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64 shadow-sm">
                            <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                        </div>
                        <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2.5 px-5 rounded-lg transition-colors shadow-sm flex items-center">
                            <span class="mr-2">+</span> Add New Record
                        </button>
                    </div>
                    
                    <!-- Data Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead id="table-head" class="bg-gray-100/80 text-gray-600 uppercase text-xs font-bold tracking-wider border-b border-gray-200">
                                <!-- Headers injected via JS -->
                            </thead>
                            <tbody id="table-body" class="text-gray-600 text-sm font-medium">
                                <!-- Rows injected via JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Loading State -->
                    <div id="loading-spinner" class="py-16 text-center hidden">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-200 border-t-blue-600 mb-2"></div>
                        <p class="text-gray-500 font-medium">Fetching records from database...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

 <!-- Prescription Modal -->
<div id="modal-prescription" style="display:none;" class="fixed inset-0 z-50 items-center justify-center bg-black/50">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden">

    <div class="px-8 py-5 border-b border-slate-100 bg-slate-50/80 flex justify-between items-center">

        <h3 class="text-xl font-bold text-slate-800">
            Add Prescription
        </h3>

        <button
            onclick="closeModal()"
            class="text-slate-500 hover:text-slate-800 text-2xl font-bold"
        >
            ×
        </button>

    </div>

    <form id="prescription-form" class="p-8">

        <input type="hidden" id="prescription-appointment-id">

        <div class="space-y-5">

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                    Medicine ID
                </label>

                <input
                    type="number"
                    id="prescription-medicine-id"
                    class="w-full border border-slate-300 p-3 rounded-xl"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                    Dosage
                </label>

                <input
                    type="text"
                    id="prescription-dosage"
                    placeholder="1 tablet after food"
                    class="w-full border border-slate-300 p-3 rounded-xl"
                >
            </div>

            <div class="grid grid-cols-2 gap-5">

                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                        Duration (days)
                    </label>

                    <input
                        type="number"
                        id="prescription-duration"
                        class="w-full border border-slate-300 p-3 rounded-xl"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="prescription-quantity"
                        class="w-full border border-slate-300 p-3 rounded-xl"
                    >
                </div>

            </div>

        </div>

        <div class="mt-8 flex justify-end gap-4">

            <button
                type="button"
                onclick="closeModal()"
                class="px-6 py-3 text-base font-semibold text-slate-600 hover:bg-slate-100 rounded-xl"
            >
                Cancel
            </button>

            <button
                type="button"
                onclick="savePrescription()"
                class="px-6 py-3 text-base font-bold bg-purple-600 text-white rounded-xl hover:bg-purple-700"
            >
                Save Prescription
            </button>

        </div>

    </form>
    </div>
</div>

    <!-- Application Logic -->

    <script>
        // Check server connection status
        async function checkServer() {
            const statusEl = document.getElementById('server-status');
            try {
                // Testing the patients endpoint as a health check
                const res = await fetch('/api/patients');
                if (res.ok) {
                    statusEl.innerHTML = '<span class="text-green-500 animate-pulse mr-1">●</span> Connected';
                } else {
                    throw new Error('API returned error');
                }
            } catch (err) {
                statusEl.innerHTML = '<span class="text-red-500 mr-1">●</span> Offline';
                console.error("Server connection failed.");
            }
        }

        // Generic Data Fetcher
        async function fetchData(endpoint) {
            const tableBody = document.getElementById('table-body');
            const spinner = document.getElementById('loading-spinner');
            
            tableBody.classList.add('loading');
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`/api/${endpoint}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                spinner.classList.add('hidden');
                tableBody.classList.remove('loading');
                return data;
            } catch (error) {
                spinner.classList.add('hidden');
                tableBody.classList.remove('loading');
                tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500 font-bold bg-red-50">Database connection failed. Ensure your PostgreSQL server is running.</td></tr>`;
                return [];
            }
        }

        // Render functions for each module
        async function renderPatients() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = `<tr><th class="py-4 px-6">ID</th><th class="py-4 px-6">Patient Name</th><th class="py-4 px-6">Blood</th><th class="py-4 px-6">Phone</th><th class="py-4 px-6 text-right">Actions</th></tr>`;
            
            const data = await fetchData('patients');
            if (!data.length) { body.innerHTML = emptyRow(5, "No patients found."); return; }

            body.innerHTML = data.map(p => `
                <tr class="border-b border-gray-100 hover:bg-blue-50/50 transition-colors group">
                    <td class="py-3 px-6 text-gray-400 font-bold">#${p.patient_id}</td>
                    <td class="py-3 px-6 text-gray-900 font-bold">${p.name} <span class="text-xs font-normal text-gray-500 block">${p.gender || 'N/A'}</span></td>
                    <td class="py-3 px-6"><span class="bg-red-100 text-red-700 py-1 px-2.5 rounded text-xs font-bold border border-red-200">${p.blood_group || '-'}</span></td>
                    <td class="py-3 px-6 text-gray-600">${p.phone}</td>
                    <td class="py-3 px-6 text-right"><button class="text-blue-500 hover:text-blue-700 font-semibold opacity-0 group-hover:opacity-100 transition-opacity">View Profile</button></td>
                </tr>
            `).join('');
        }

        async function renderDoctors() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = `<tr><th class="py-4 px-6">ID</th><th class="py-4 px-6">Doctor Name</th><th class="py-4 px-6">Specialty</th><th class="py-4 px-6">Contact</th><th class="py-4 px-6 text-right">Actions</th></tr>`;
            
            const data = await fetchData('doctors');
            if (!data.length) { body.innerHTML = emptyRow(5, "No doctors found."); return; }

            body.innerHTML = data.map(d => `
                <tr class="border-b border-gray-100 hover:bg-blue-50/50 transition-colors group">
                    <td class="py-3 px-6 text-gray-400 font-bold">#${d.doctor_id}</td>
                    <td class="py-3 px-6 text-gray-900 font-bold">Dr. ${d.name}</td>
                    <td class="py-3 px-6"><span class="bg-blue-100 text-blue-700 py-1 px-3 rounded-full text-xs font-bold border border-blue-200">${d.specialization || 'General'}</span></td>
                    <td class="py-3 px-6 text-gray-600">${d.phone} <span class="text-xs block text-gray-400">${d.email || ''}</span></td>
                    <td class="py-3 px-6 text-right"><button class="text-blue-500 hover:text-blue-700 font-semibold opacity-0 group-hover:opacity-100 transition-opacity">Schedule</button></td>
                </tr>
            `).join('');
        }

        async function renderAppointments() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = `<tr><th class="py-4 px-6">Appt Date</th><th class="py-4 px-6">Patient</th><th class="py-4 px-6">Doctor</th><th class="py-4 px-6">Status</th><th class="py-4 px-6 text-right">Actions</th></tr>`;
            
            const data = await fetchData('appointments');
            if (!data.length) { body.innerHTML = emptyRow(5, "No upcoming appointments."); return; }

            body.innerHTML = data.map(a => {
                const dateObj = new Date(a.appointment_date);
                const dateStr = dateObj.toLocaleDateString();
                const timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                // Status Color Logic
                let statusColor = "bg-gray-100 text-gray-700 border-gray-200";
                if(a.status === 'Completed') statusColor = "bg-green-100 text-green-700 border-green-200";
                if(a.status === 'Cancelled') statusColor = "bg-red-100 text-red-700 border-red-200";
                if(a.status === 'Scheduled') statusColor = "bg-yellow-100 text-yellow-700 border-yellow-200";

                return `
                <tr class="border-b border-gray-100 hover:bg-blue-50/50 transition-colors group">
                    <td class="py-3 px-6 text-gray-900 font-bold">${dateStr} <span class="text-xs text-blue-600 ml-2 block sm:inline">${timeStr}</span></td>
                    <td class="py-3 px-6 font-medium">${a.patient_name}</td>
                    <td class="py-3 px-6 font-medium text-gray-600">Dr. ${a.doctor_name}</td>
                    <td class="py-3 px-6"><span class="${statusColor} py-1 px-3 rounded-full text-xs font-bold border">${a.status || 'Scheduled'}</span></td>
                    <td class="py-3 px-6 text-right">

    <div class="flex justify-end gap-2">

        <button
            onclick="openPrescriptionModal(${a.appointment_id})"
            class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded-lg text-sm font-semibold"
        >
            Prescription
        </button>

    </div>

</td>
                </tr>
            `}).join('');
        }

        async function renderMedicines() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = `<tr><th class="py-4 px-6">Med ID</th><th class="py-4 px-6">Drug Name</th><th class="py-4 px-6">Category / Unit</th><th class="py-4 px-6">Price</th><th class="py-4 px-6">Stock Level</th></tr>`;
            
            const data = await fetchData('medicines');
            if (!data.length) { body.innerHTML = emptyRow(5, "Pharmacy inventory is empty."); return; }

            body.innerHTML = data.map(m => {
                const isLowStock = m.stock < 20;
                return `
                <tr class="border-b border-gray-100 hover:bg-blue-50/50 transition-colors group">
                    <td class="py-3 px-6 text-gray-400 font-bold">#${m.medicine_id}</td>
                    <td class="py-3 px-6 text-gray-900 font-bold">${m.name}</td>
                    <td class="py-3 px-6 font-medium text-gray-600">${m.category || 'General'} <span class="text-xs text-gray-400 block">${m.unit || ''}</span></td>
                    <td class="py-3 px-6 text-green-600 font-bold">$${parseFloat(m.price).toFixed(2)}</td>
                    <td class="py-3 px-6 font-bold ${isLowStock ? 'text-red-500' : 'text-gray-700'}">${m.stock} ${isLowStock ? '<span class="text-xs bg-red-100 px-2 py-0.5 rounded ml-2">Low</span>' : ''}</td>
                </tr>
            `}).join('');
        }

        // Helper to generate empty table rows
        function emptyRow(colspan, message) {
            return `<tr><td colspan="${colspan}" class="py-12 text-center text-gray-500 font-medium bg-gray-50/50 rounded-b-lg border-t border-gray-100">${message}</td></tr>`;
        }

        // Master Tab Switcher
        function switchTab(tab) {
            // Update Title
            const titles = {
                'patients': 'Patients Directory',
                'doctors': 'Doctors Directory',
                'appointments': 'Appointments Schedule',
                'medicines': 'Pharmacy Inventory'
            };
            document.getElementById('page-title').textContent = titles[tab];

            // Reset all buttons to inactive state
            const buttons = document.querySelectorAll('#sidebar-nav button');
            buttons.forEach(btn => {
                btn.className = "w-full text-left flex items-center py-3 px-4 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium transition-all";
            });

            // Set active state on clicked button
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.className = "w-full text-left flex items-center py-3 px-4 rounded-lg bg-blue-50 text-blue-700 font-semibold transition-all";

            // Call respective render function
            if (tab === 'patients') renderPatients();
            if (tab === 'doctors') renderDoctors();
            if (tab === 'appointments') renderAppointments();
            if (tab === 'medicines') renderMedicines();
        }

        // Initialize App on load
        checkServer();
        renderPatients();
 
window.openPrescriptionModal = function(appointmentId) {

    console.log("clicked", appointmentId);

    const modal = document.getElementById('modal-prescription');

    modal.style.display = 'flex';

    document.getElementById('prescription-appointment-id').value = appointmentId;
};

window.closeModal = function() {

    document.getElementById('modal-prescription').style.display = 'none';
};



    </script>
</body>
</html>
