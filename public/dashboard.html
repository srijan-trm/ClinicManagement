<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-lg border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-blue-600">MediClinic DB</h1>
            </div>
            <nav class="mt-4 flex-1">
                <button onclick="switchTab('patients')" id="tab-patients" class="w-full text-left flex items-center py-3 px-6 bg-blue-50 text-blue-700 border-l-4 border-blue-500 font-medium transition-colors">
                    Patients Directory
                </button>
                <button onclick="switchTab('doctors')" id="tab-doctors" class="w-full text-left flex items-center py-3 px-6 text-gray-600 hover:bg-gray-50 hover:text-gray-900 border-l-4 border-transparent font-medium transition-colors">
                    Doctors Directory
                </button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8">
            <header class="flex justify-between items-center mb-8">
                <h2 id="page-title" class="text-3xl font-bold text-gray-800">Patients Directory</h2>
                <div class="text-sm text-gray-500 bg-white px-4 py-2 rounded shadow-sm border border-gray-200">
                    Live Server Status: <span id="server-status" class="text-yellow-500 font-bold">Checking...</span>
                </div>
            </header>

            <!-- Data Table Container -->
            <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-700">Records</h3>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded transition-colors shadow">
                        + Add New
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead id="table-head" class="bg-gray-100 text-gray-600 uppercase text-xs font-bold leading-normal">
                            <!-- Headers injected via JS -->
                        </thead>
                        <tbody id="table-body" class="text-gray-600 text-sm font-light">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Loading State -->
                <div id="loading-spinner" class="py-10 text-center text-gray-500 hidden">
                    Loading data...
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const API_BASE = '/api';
        let currentTab = 'patients';

        // Check server health on load
        async function checkServer() {
            const statusEl = document.getElementById('server-status');
            try {
                const res = await fetch('/api/patients');
                if (res.ok) {
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'text-green-500 font-bold';
                }
            } catch (err) {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'text-red-500 font-bold';
                console.error("Server connection failed. Ensure Express is running.");
            }
        }

        // Fetch Data from Backend
        async function fetchData(endpoint) {
            const tableBody = document.getElementById('table-body');
            const spinner = document.getElementById('loading-spinner');
            
            tableBody.innerHTML = '';
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/${endpoint}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                spinner.classList.add('hidden');
                return data;
            } catch (error) {
                spinner.classList.add('hidden');
                tableBody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-500 font-medium">Failed to load data. Is your backend running on port 3000?</td></tr>`;
                console.error('Fetch error:', error);
                return [];
            }
        }

        // Render Patients Table
        async function renderPatients() {
            const data = await fetchData('patients');
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');

            head.innerHTML = `
                <tr>
                    <th class="py-3 px-6">ID</th>
                    <th class="py-3 px-6">Name</th>
                    <th class="py-3 px-6">Blood Group</th>
                    <th class="py-3 px-6">Phone</th>
                    <th class="py-3 px-6">Gender</th>
                </tr>
            `;

            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500">No patients found.</td></tr>`;
                return;
            }

            body.innerHTML = data.map(patient => `
                <tr class="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                    <td class="py-3 px-6 font-bold text-gray-700">#${patient.patient_id}</td>
                    <td class="py-3 px-6 font-medium text-gray-900">${patient.name}</td>
                    <td class="py-3 px-6">
                        <span class="bg-red-100 text-red-700 py-1 px-3 rounded-full text-xs font-bold border border-red-200">
                            ${patient.blood_group || 'N/A'}
                        </span>
                    </td>
                    <td class="py-3 px-6 text-gray-600">${patient.phone}</td>
                    <td class="py-3 px-6 text-gray-600">${patient.gender || 'N/A'}</td>
                </tr>
            `).join('');
        }

        // Render Doctors Table
        async function renderDoctors() {
            const data = await fetchData('doctors');
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');

            head.innerHTML = `
                <tr>
                    <th class="py-3 px-6">ID</th>
                    <th class="py-3 px-6">Name</th>
                    <th class="py-3 px-6">Specialization</th>
                    <th class="py-3 px-6">Phone</th>
                    <th class="py-3 px-6">Email</th>
                </tr>
            `;

            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500">No doctors found.</td></tr>`;
                return;
            }

            body.innerHTML = data.map(doctor => `
                <tr class="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                    <td class="py-3 px-6 font-bold text-gray-700">#${doctor.doctor_id}</td>
                    <td class="py-3 px-6 font-medium text-gray-900">Dr. ${doctor.name}</td>
                    <td class="py-3 px-6">
                        <span class="bg-blue-100 text-blue-700 py-1 px-3 rounded-full text-xs font-bold border border-blue-200">
                            ${doctor.specialization || 'General'}
                        </span>
                    </td>
                    <td class="py-3 px-6 text-gray-600">${doctor.phone}</td>
                    <td class="py-3 px-6 text-gray-600">${doctor.email || 'N/A'}</td>
                </tr>
            `).join('');
        }

        // Tab Switching Logic
        function switchTab(tab) {
            currentTab = tab;
            
            // Update UI styles for tabs
            const pTab = document.getElementById('tab-patients');
            const dTab = document.getElementById('tab-doctors');
            
            const activeClass = "bg-blue-50 text-blue-700 border-l-4 border-blue-500 font-medium";
            const inactiveClass = "text-gray-600 hover:bg-gray-50 hover:text-gray-900 border-l-4 border-transparent font-medium";

            if (tab === 'patients') {
                pTab.className = `w-full text-left flex items-center py-3 px-6 transition-colors ${activeClass}`;
                dTab.className = `w-full text-left flex items-center py-3 px-6 transition-colors ${inactiveClass}`;
                document.getElementById('page-title').textContent = "Patients Directory";
                renderPatients();
            } else {
                dTab.className = `w-full text-left flex items-center py-3 px-6 transition-colors ${activeClass}`;
                pTab.className = `w-full text-left flex items-center py-3 px-6 transition-colors ${inactiveClass}`;
                document.getElementById('page-title').textContent = "Doctors Directory";
                renderDoctors();
            }
        }

        // Initialize App
        checkServer();
        renderPatients();

    </script>
</body>
</html>
