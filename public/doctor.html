
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 font-sans">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-xl border-r border-slate-200 flex flex-col">

            <div class="p-6 border-b border-slate-100 bg-green-600">

                <h1 class="text-2xl font-bold text-white">
                    Doctor Portal
                </h1>

            </div>

            <nav class="p-4 space-y-2">

                <button
                    class="w-full text-left px-4 py-3 rounded-xl bg-green-50 text-green-700 font-semibold"
                >
                    My Profile
                </button>

                <button
                    class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 font-medium"
                >
                    Appointments
                </button>

            </nav>

        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8">

            <!-- Heading -->
            <div class="mb-8">

                <h2 class="text-3xl font-bold text-slate-800">
                    Welcome, Doctor
                </h2>

                <p class="text-slate-500 mt-1">
                    Manage patient appointments
                </p>

            </div>

            <!-- Doctor Profile -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

                <div class="flex items-center gap-6">

                    <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center text-3xl">
                        🩺
                    </div>

                    <div>

                        <h3 id="doctor-name"
                            class="text-2xl font-bold text-slate-800">

                            Loading...

                        </h3>

                        <p id="doctor-specialization"
                           class="text-slate-500">

                            Loading...

                        </p>

                    </div>

                </div>

            </div>

            <!-- Appointment List -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mt-8">

                <h3 class="text-2xl font-bold text-slate-800 mb-6">
                    Today Appointments
                </h3>

                <div id="appointments-list" class="space-y-4">

                    Loading appointments...

                </div>

            </div>

        </div>

    </div>
    
<script>

async function loadDoctor() {

    try {

        // temporary doctor id
        const doctorId = 1;

        const response =
            await fetch(`/api/doctors/${doctorId}`);

        const doctor = await response.json();

        document.getElementById('doctor-name').innerText =
            `Dr. ${doctor.name}`;

        document.getElementById('doctor-specialization').innerText =
            doctor.specialization || 'General Doctor';

    } catch (error) {

        console.error(error);

    }
}

async function loadAppointments() {

    try {

        const doctorId = 1;

        const response =
            await fetch('/api/appointments');

        const appointments =
            await response.json();

        const doctorAppointments =
            appointments.filter(a =>
                a.doctor_id == doctorId
            );

        const container =
            document.getElementById('appointments-list');

        if (doctorAppointments.length === 0) {

            container.innerHTML =
                `<p class="text-slate-500">
                    No appointments found.
                </p>`;

            return;
        }

        container.innerHTML =
            doctorAppointments.map(a => `

                <div class="border border-slate-200 rounded-xl p-5 flex justify-between items-center">

                    <div>

                        <h4 class="font-bold text-slate-800">
                            ${a.patient_name}
                        </h4>

                        <p class="text-slate-500 text-sm">
                            ${new Date(a.appointment_date).toLocaleString()}
                        </p>

                    </div>

                    <button
                        onclick="completeAppointment(${a.appointment_id})"
                        class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-semibold"
                    >
                        Complete
                    </button>

                </div>

            `).join('');

    } catch (error) {

        console.error(error);

    }
}

async function completeAppointment(id) {

    try {

        await fetch(`/api/appointments/${id}`, {

            method: 'PUT',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                status: 'Completed'
            })

        });

        alert('Appointment Completed');

        loadAppointments();

    } catch (error) {

        console.error(error);

    }
}

loadDoctor();
loadAppointments();

</script>


</body>
</html>
