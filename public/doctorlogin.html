
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md">

        <h1 class="text-3xl font-bold text-center text-green-600 mb-8">
            Doctor Login
        </h1>

        <div class="space-y-5">

            <input
                type="email"
                id="email"
                placeholder="Email"
                class="w-full border border-slate-300 rounded-xl p-3"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                class="w-full border border-slate-300 rounded-xl p-3"
            >

            <button
                onclick="loginDoctor()"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold"
            >
                Login
            </button>

            <button
                onclick="window.location.href='/doctorsignup.html'"
                class="w-full border border-green-600 text-green-600 py-3 rounded-xl font-bold"
            >
                Create New Account
            </button>

        </div>

    </div>

<script>

async function loginDoctor() {

    try {

        const email =
            document.getElementById('email').value;

        const password =
            document.getElementById('password').value;

        const response =
            await fetch('/api/doctors');

        const doctors =
            await response.json();

        const doctor = doctors.find(d =>
            d.email === email &&
            d.password === password
        );

        if (!doctor) {

            alert('Invalid Login');

            return;
        }

        localStorage.setItem(
            'doctorId',
            doctor.doctor_id
        );

        alert('Login Successful');

        window.location.href = '/doctor.html';

    } catch (error) {

        console.error(error);

    }
}

</script>

</body>
</html>
