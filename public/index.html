<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediClinic Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 flex flex-col items-center justify-center min-h-screen p-6">

    <div id="selection-view" class="w-full max-w-md fade-in">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700 tracking-tight">MediClinic</h1>
            <p class="text-slate-500 mt-2">Clinic Management System</p>
        </div>

        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-6 text-center">Select your login portal</h2>
            
            <div class="space-y-4">
                <button onclick="showLogin('patient')" class="w-full flex items-center justify-between bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-800 font-semibold py-4 px-6 rounded-lg transition-colors">
                    <span class="flex items-center gap-3">
                        <span class="text-xl">🏥</span> 
                        Patient Portal
                    </span>
                    <span class="text-blue-400">&rarr;</span>
                </button>
                
                <button onclick="showLogin('admin')" class="w-full flex items-center justify-between bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 font-semibold py-4 px-6 rounded-lg transition-colors">
                    <span class="flex items-center gap-3">
                        <span class="text-xl">🩺</span> 
                        Admin & Staff
                    </span>
                    <span class="text-slate-400">&rarr;</span>
                </button>
            </div>
        </div>
    </div>

    <div id="login-view" class="hidden w-full max-w-md fade-in relative">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700 tracking-tight">MediClinic</h1>
            <p class="text-slate-500 mt-2" id="login-subtitle">Please enter your credentials</p>
        </div>

        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-8 relative">
            
            <button onclick="showSelection()" class="absolute top-6 left-6 text-slate-400 hover:text-slate-700 text-sm font-medium transition-colors">
                &larr; Back
            </button>

            <h2 id="login-title" class="text-xl font-bold text-slate-800 mb-6 mt-8 border-b border-slate-100 pb-4">
                Login
            </h2>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Username / Email</label>
                    <input type="text" id="identifier" placeholder="Enter your email or username" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow">
                </div>

                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-sm transition-colors mt-2">
                    Sign In
                </button>
                
                <div id="signup-container" class="text-center mt-6 pt-4 border-t border-slate-100">
                    <p class="text-sm text-slate-500">
                        New patient? <a href="patientsignup.html" class="font-semibold text-blue-600 hover:underline">Create an account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeRole = '';

        function showLogin(role) {
            activeRole = role;
            
            document.getElementById('selection-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            
            const titleEl = document.getElementById('login-title');
            const signupEl = document.getElementById('signup-container');

            if (role === 'patient') {
                titleEl.innerText = 'Patient Login';
                signupEl.classList.remove('hidden'); 
            } else {
                titleEl.innerText = 'Staff Login';
                signupEl.classList.add('hidden'); 
            }
        }

        function showSelection() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('selection-view').classList.remove('hidden');
            
            document.getElementById('identifier').value = '';
            document.getElementById('password').value = '';
            activeRole = '';
        }

        async function handleLogin() {
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            if (!identifier || !password) {
                alert("Please fill in both fields.");
                return;
            }

            try {
                if (activeRole === 'patient') {
                    const res = await fetch('/api/patients');
                    const patients = await res.json();
                    const patient = patients.find(p => p.email === identifier && p.password === password);

                    if (patient) {
                        localStorage.setItem('patientId', patient.patient_id);
                        window.location.href = '/patient.html'; 
                    } else {
                        alert('Invalid Patient credentials.');
                    }
                } 
                else if (activeRole === 'admin') {
                    if (identifier === 'admin' && password === 'admin') {
                        localStorage.setItem('isAdmin', 'true');
                        window.location.href = '/admin.html'; 
                    } else {
                        alert('Invalid Admin username or password.');
                    }
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("Server error. Make sure your backend is running!");
            }
        }
    </script>
</body>
</html>
