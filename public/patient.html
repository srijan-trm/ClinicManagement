<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediClinic - Patient Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 15px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50/50 text-slate-800 antialiased h-screen overflow-hidden flex">

    <div class="w-72 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl shadow-slate-200/20">
        <div class="p-6 flex items-center gap-4 border-b border-slate-100">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-200">
                <span class="text-xl">🏥</span>
            </div>
            <h1 class="text-2xl font-extrabold text-blue-700 tracking-tight">MediClinic</h1>
        </div>
        
        <nav class="mt-6 flex-1 space-y-2 px-4">
            <button id="profile-btn" onclick="showSection('profile')" class="w-full flex items-center gap-3 py-3 px-4 rounded-xl text-base font-semibold bg-blue-50 text-blue-700 transition-all">
                👤 My Profile
            </button>
            <button id="appointments-btn" onclick="showSection('appointments')" class="w-full flex items-center gap-3 py-3 px-4 rounded-xl text-base font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all">
                📅 My Appointments
            </button>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <button onclick="logout()" class="w-full py-2.5 text-sm font-semibold text-rose-600 hover:bg-rose-50 rounded-lg transition-colors">
                Log Out
            </button>
        </div>
    </div>

    <div class="flex-1 flex flex-col relative h-full overflow-hidden">
        
        <header class="glass-header z-10 border-b border-slate-200 px-10 py-6 shrink-0">
            <p class="text-base font-medium text-blue-500 mb-1 tracking-wide uppercase">Patient Portal</p>
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Welcome to your dashboard</h2>
        </header>

        <main class="flex-1 overflow-y-auto p-10">
            
            <div id="profile-section">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-3xl">
                    <div class="flex items-center gap-6 border-b border-slate-100 pb-6">
                        <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center text-3xl border border-blue-100">
                            👤
                        </div>
                        <div>
                            <h3 id="patient-name" class="text-2xl font-bold text-slate-800">Loading...</h3>
                            <p id="patient-id" class="text-slate-500 font-medium">Loading...</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-6">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Blood Group</p>
                            <p id="patient-blood" class="text-lg font-bold text-slate-800">...</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Phone</p>
                            <p id="patient-phone" class="text-lg font-bold text-slate-800">...</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Gender</p>
                            <p id="patient-gender" class="text-lg font-bold text-slate-800">...</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Email</p>
                            <p id="patient-email" class="text-sm font-bold text-slate-800 truncate">...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="appointments-section" class="hidden space-y-8 max-w-4xl">
                
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                    <h3 class="text-xl font-bold text-slate-800 mb-6 border-b border-slate-100 pb-3">Book New Appointment</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">Select Doctor</label>
                            <select id="appointment-doctor" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                <option value="">Choose Doctor</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">Date</label>
                            <input type="date" id="appointment-date" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">Time</label>
                            <input type="time" id="appointment-time" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end">
                        <button onclick="bookAppointment()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-sm transition-colors">
                            Book Appointment
                        </button>
                    </div>
                </div>
               
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                    <h3 class="text-xl font-bold text-slate-800 mb-6 border-b border-slate-100 pb-3">My Appointment History</h3>
                    <div id="appointments-list" class="space-y-4">
                        <p class="text-slate-500">Loading appointments...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Check if user is actually logged in
        if (!localStorage.getItem('patientId')) {
            window.location.href = '/index.html';
        }

        function logout() {
            localStorage.removeItem('patientId');
            window.location.href = '/index.html';
        }

        async function loadPatient() {
            try {
                const patientId = localStorage.getItem('patientId');
                const response = await fetch(`/api/patients/${patientId}`);
                const patient = await response.json();

                document.getElementById('patient-name').innerText = patient.name;
                document.getElementById('patient-id').innerText = `Patient ID: #${patient.patient_id}`;
                document.getElementById('patient-blood').innerText = patient.blood_group || '-';
                document.getElementById('patient-phone').innerText = patient.phone || '-';
                document.getElementById('patient-gender').innerText = patient.gender || '-';
                if(document.getElementById('patient-email')) document.getElementById('patient-email').innerText = patient.email || '-';
            } catch (error) { console.error(error); }
        }

        async function loadDoctors() {
            try {
                const response = await fetch('/api/doctors');
                const doctors = await response.json();
                const select = document.getElementById('appointment-doctor');
                doctors.forEach(doc => {
                    const option = document.createElement('option');
                    option.value = doc.doctor_id;
                    option.textContent = `Dr. ${doc.name} - ${doc.specialization || 'General'}`;
                    select.appendChild(option);
                });
            } catch (error) { console.error(error); }
        }

        async function loadAppointments() {
            try {
                const patientId = localStorage.getItem('patientId');
                const response = await fetch('/api/appointments');
                const appointments = await response.json();
                
                const patientAppointments = appointments.filter(a => a.patient_id == patientId);
                const container = document.getElementById('appointments-list');

                if (patientAppointments.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-sm bg-slate-50 p-4 rounded-lg border border-slate-100">No appointments booked yet.</p>`;
                    return;
                }

                container.innerHTML = patientAppointments.map(a => {
                    const statusColor = a.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700';
                    return `
                    <div class="border border-slate-100 rounded-xl p-5 flex justify-between items-center hover:bg-slate-50 transition-colors">
                        <div>
                            <h4 class="font-bold text-slate-800">Dr. ${a.doctor_name}</h4>
                            <p class="text-slate-500 text-sm mt-0.5">${new Date(a.appointment_date).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})}</p>
                        </div>
                        <span class="${statusColor} px-3 py-1.5 rounded-lg text-sm font-bold border border-white/20 shadow-sm">
                            ${a.status}
                        </span>
                    </div>`
                }).join('');
            } catch (error) { console.error(error); }
        }

        async function bookAppointment() {
            try {
                const patient_id = localStorage.getItem('patientId');
                const doctor_id = document.getElementById('appointment-doctor').value;
                const date = document.getElementById('appointment-date').value;
                const time = document.getElementById('appointment-time').value;

                if(!doctor_id || !date || !time) {
                    alert("Please fill in all appointment fields.");
                    return;
                }

                const appointment_date = `${date} ${time}`;

                const response = await fetch('/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patient_id, doctor_id, appointment_date, status: 'Scheduled' })
                });

                alert('Appointment Booked Successfully');
                
                // Reset form and reload list
                document.getElementById('appointment-date').value = '';
                document.getElementById('appointment-time').value = '';
                loadAppointments();

            } catch (error) {
                console.error(error);
                alert('Failed to book appointment');
            }
        }

        function showSection(section) {
            const profile = document.getElementById('profile-section');
            const appointments = document.getElementById('appointments-section');
            const profileBtn = document.getElementById('profile-btn');
            const appointmentsBtn = document.getElementById('appointments-btn');

            profile.classList.add('hidden');
            appointments.classList.add('hidden');

            const inactiveClass = "w-full flex items-center gap-3 py-3 px-4 rounded-xl text-base font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all";
            const activeClass = "w-full flex items-center gap-3 py-3 px-4 rounded-xl text-base font-semibold bg-blue-50 text-blue-700 transition-all";

            profileBtn.className = inactiveClass;
            appointmentsBtn.className = inactiveClass;

            if (section === 'profile') {
                profile.classList.remove('hidden');
                profileBtn.className = activeClass;
            } else if (section === 'appointments') {
                appointments.classList.remove('hidden');
                appointmentsBtn.className = activeClass;
            }
        }

        // Initialize
        loadPatient();
        loadDoctors();
        loadAppointments();
    </script>
</body>
</html>
