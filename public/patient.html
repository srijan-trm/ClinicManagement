



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 font-sans">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-xl border-r border-slate-200 flex flex-col">

            <div class="p-6 border-b border-slate-100 bg-blue-600">

                <h1 class="text-2xl font-bold text-white">
                    Patient Portal
                </h1>

            </div>

            <nav class="p-4 space-y-2">

               <button id="profile-btn" onclick="showSection('profile')" class="w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold" > My Profile </button>

                <button id="appointments-btn" onclick="showSection('appointments')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 font-medium" > My Appointments </button>

               

            </nav>

        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8">

            <!-- Top Heading -->
            <div class="mb-8">

                <h2 class="text-3xl font-bold text-slate-800">
                    Welcome, Patient
                </h2>

                <p class="text-slate-500 mt-1">
                    Manage your appointments and health records
                </p>

            </div>
<div id="profile-section">
            <!-- Profile Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                



                <div class="flex items-center gap-6">

                    <div class="w-20 h-20 rounded-full bg-blue-100 flex items-center justify-center text-3xl">
                        👤
                    </div>

                    <div>

                       <h3 id="patient-name" class="text-2xl font-bold text-slate-800"> Loading... </h3>

                        <p id="patient-id" class="text-slate-500"> Loading... </p>

                    </div>

                </div>

                <div class="grid grid-cols-2 gap-6 mt-8">

                    <div>

                        <p class="text-sm text-slate-500">
                            Blood Group
                        </p>

                   <p id="patient-blood" class="font-bold text-slate-800"> Loading... </p>
                    </div>

                    <div>

                        <p class="text-sm text-slate-500">
                            Phone
                        </p>

                       <p id="patient-phone" class="font-bold text-slate-800"> Loading... </p>

                    </div>

                    <div>

                        <p class="text-sm text-slate-500">
                            Gender
                        </p>

                       <p id="patient-gender" class="font-bold text-slate-800"> Loading... </p>

                    </div>

                    <div>

                        <p class="text-sm text-slate-500">
                            Age
                        </p>

                        <p class="font-bold text-slate-800">
                            22
                        </p>

                    </div>

                </div>

            </div>

        </div>

    
<div id="appointments-section" class="hidden">

    <!-- Book Appointment -->

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <h3 class="text-2xl font-bold text-slate-800 mb-6">
            Book Appointment
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

            <div>

                <label class="block text-sm font-semibold text-slate-600 mb-2">
                    Select Doctor
                </label>

                <select
                    id="appointment-doctor"
                    class="w-full border border-slate-300 rounded-xl p-3"
                >
                    <option value="">Choose Doctor</option>
                </select>

            </div>

            <div>

                <label class="block text-sm font-semibold text-slate-600 mb-2">
                    Appointment Date
                </label>

                <input
                    type="date"
                    id="appointment-date"
                    class="w-full border border-slate-300 rounded-xl p-3"
                >

            </div>

            <div>

                <label class="block text-sm font-semibold text-slate-600 mb-2">
                    Appointment Time
                </label>

                <input
                    type="time"
                    id="appointment-time"
                    class="w-full border border-slate-300 rounded-xl p-3"
                >

            </div>

        </div>

        <button
            onclick="bookAppointment()"
            class="mt-6 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold"
        >
            Book Appointment
        </button>

    </div>
   
<!-- Appointment List -->

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mt-8">

    <h3 class="text-2xl font-bold text-slate-800 mb-6">
        My Appointments
    </h3>

    <div id="appointments-list" class="space-y-4">

        <p class="text-slate-500">
            Loading appointments...
        </p>

    </div>

</div>



</div>


    </div>
</div>
<script>

async function loadPatient() {

    try {

        // temporary patient id
        const patientId = 1;

        const response = await fetch(`/api/patients/${patientId}`);

        const patient = await response.json();

        document.getElementById('patient-name').innerText = patient.name;

        document.getElementById('patient-id').innerText =
            `Patient ID: #${patient.patient_id}`;

        document.getElementById('patient-blood').innerText =
            patient.blood_group || '-';

        document.getElementById('patient-phone').innerText =
            patient.phone || '-';

        document.getElementById('patient-gender').innerText =
            patient.gender || '-';

    } catch (error) {

        console.error(error);

    }
}




async function loadDoctors() {

    try {

        const response = await fetch('/api/doctors');

        const doctors = await response.json();

        const select = document.getElementById('appointment-doctor');

        doctors.forEach(doc => {

            const option = document.createElement('option');

            option.value = doc.doctor_id;

            option.textContent =
                `Dr. ${doc.name} - ${doc.specialization}`;

            select.appendChild(option);

        });

    } catch (error) {

        console.error(error);

    }
}

async function loadAppointments() {

    try {

        const patientId = 1;

        const response =
            await fetch('/api/appointments');

        const appointments =
            await response.json();

        const patientAppointments =
            appointments.filter(a =>
                a.patient_id == patientId
            );

        const container =
            document.getElementById('appointments-list');

        if (patientAppointments.length === 0) {

            container.innerHTML =
                `<p class="text-slate-500">
                    No appointments booked.
                </p>`;

            return;
        }

        container.innerHTML =
            patientAppointments.map(a => `

                <div class="border border-slate-200 rounded-xl p-5 flex justify-between items-center">

                    <div>

                        <h4 class="font-bold text-slate-800">
                            Dr. ${a.doctor_name}
                        </h4>

                        <p class="text-slate-500 text-sm">
                            ${new Date(a.appointment_date).toLocaleString()}
                        </p>

                    </div>

                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold">
                        ${a.status}
                    </span>

                </div>

            `).join('');

    } catch (error) {

        console.error(error);

    }
}



async function bookAppointment() {

    try {

        const patient_id = 1;

        const doctor_id =
            document.getElementById('appointment-doctor').value;

        const date =
            document.getElementById('appointment-date').value;

        const time =
            document.getElementById('appointment-time').value;

        const appointment_date = `${date} ${time}`;

        const response = await fetch('/api/appointments', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                patient_id,
                doctor_id,
                appointment_date,
                status: 'Scheduled'
            })

        });

        const data = await response.json();

        alert('Appointment Booked Successfully');

        console.log(data);

    } catch (error) {

        console.error(error);

        alert('Failed to book appointment');

    }
}

function showSection(section) {

    const profile =
        document.getElementById('profile-section');

    const appointments =
        document.getElementById('appointments-section');

    const profileBtn =
        document.getElementById('profile-btn');

    const appointmentsBtn =
        document.getElementById('appointments-btn');

    // Hide all sections
    profile.classList.add('hidden');
    appointments.classList.add('hidden');

    // Reset button styles
    profileBtn.className =
        "w-full text-left px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 font-medium";

    appointmentsBtn.className =
        "w-full text-left px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 font-medium";

    // Show selected section
    if (section === 'profile') {

        profile.classList.remove('hidden');

        profileBtn.className =
            "w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold";
    }

    if (section === 'appointments') {

        appointments.classList.remove('hidden');

        appointmentsBtn.className =
            "w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold";
    }
}




loadPatient();
loadDoctors();
loadAppointments();
</script>


</body>
</html>
