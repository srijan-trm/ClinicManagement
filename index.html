<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-lg border-r border-gray-200">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-blue-600">MediClinic DB</h1>
            </div>
            <nav class="mt-6">
                <a href="#" class="flex items-center py-3 px-6 bg-blue-50 text-blue-700 border-l-4 border-blue-500">
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="#" class="flex items-center py-3 px-6 text-gray-600 hover:bg-gray-50 hover:text-gray-900">
                    <span class="font-medium">Appointments</span>
                </a>
                <a href="#" class="flex items-center py-3 px-6 text-gray-600 hover:bg-gray-50 hover:text-gray-900">
                    <span class="font-medium">Patients</span>
                </a>
                <a href="#" class="flex items-center py-3 px-6 text-gray-600 hover:bg-gray-50 hover:text-gray-900">
                    <span class="font-medium">Doctors</span>
                </a>
                <a href="#" class="flex items-center py-3 px-6 text-gray-600 hover:bg-gray-50 hover:text-gray-900">
                    <span class="font-medium">Pharmacy / Billing</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-8">
            <header class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">System Overview</h2>
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
                    + New Appointment
                </button>
            </header>

            <!-- Stats Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6 border-t-4 border-blue-500">
                    <h3 class="text-gray-500 text-sm font-semibold uppercase">Total Patients</h3>
                    <p class="text-3xl font-bold text-gray-800">124</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 border-t-4 border-green-500">
                    <h3 class="text-gray-500 text-sm font-semibold uppercase">Today's Appointments</h3>
                    <p class="text-3xl font-bold text-gray-800">12</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 border-t-4 border-purple-500">
                    <h3 class="text-gray-500 text-sm font-semibold uppercase">Active Doctors</h3>
                    <p class="text-3xl font-bold text-gray-800">8</p>
                </div>
            </div>

            <!-- Recent Patients Table Mock -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">Recent Patients</h3>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 uppercase text-xs leading-normal">
                            <th class="py-3 px-6">Patient ID</th>
                            <th class="py-3 px-6">Name</th>
                            <th class="py-3 px-6">Blood Group</th>
                            <th class="py-3 px-6">Phone</th>
                            <th class="py-3 px-6 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600 text-sm font-light" id="patient-table-body">
                        <!-- Mock Data Row -->
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-3 px-6 font-medium">1</td>
                            <td class="py-3 px-6">John Doe</td>
                            <td class="py-3 px-6"><span class="bg-red-100 text-red-600 py-1 px-3 rounded-full text-xs">O+</span></td>
                            <td class="py-3 px-6">+91 9876543210</td>
                            <td class="py-3 px-6 text-center">
                                <button class="text-blue-500 hover:text-blue-700 underline">View</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
